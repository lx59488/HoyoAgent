# 测试专用覆盖：任何 @SpringBootTest 都不许连真实 QQ 网关、也不许写用户目录。
#
# 为什么需要这个文件：main 的 application.yml 里有
#   spring.config.import: "optional:file:.env[.properties]"
# Surefire 的工作目录是仓库根，于是 .env 里的 QQ_BOT_ENABLED=true 会进测试上下文，
# QqBotGateway 在 ApplicationReadyEvent 里就去连生产网关——测试依赖外网、还留一条
# 长连接让 fork 退不掉（Surefire 等 30 秒强杀）。2026-11-18 实测踩过。
#
# 新增 @SpringBootTest 时不用再抄一遍属性，这里统一兜住。
qq.enabled=false
hoyo.memory.dir=target/test-memory
