spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: HoyoAgent

langchain4j:
  open-ai:
    chat-model:
      base-url: ${DS_BASE_URL}
      api-key: ${DS_API_KEY}
      model-name: ${DS_MODEL_NAME}
      log-requests: false
      log-responses: false
      timeout: PT60S

# hosts 不配：默认值写在 MiyousheHost 枚举里，需要覆盖时才加
#   hosts:
#     record: http://127.0.0.1:9999
hoyo:
  app-version: "2.117.0"
  client-type: "5"                       # 5 = App 端（与抓包一致）
  referer: https://webstatic.mihoyo.com/
  user-agent: Mozilla/5.0 (Linux; Android 12; V2366GA Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/110.0.5481.154 Mobile Safari/537.36 miHoYoBBS/2.117.0
  timeout: PT10S
  device-id: ${HOYO_DEVICE_ID:}          # 空 = 自动生成；复现已有会话时必须填抓包值
  cookie: ${HOYO_COOKIE:}                # 兜底；扫码写入 ~/.hoyo/credential.properties 后优先用文件

# 注：salt / role-id / server 已移除
#   - salt：只有查战绩时需要，实测不需要 DS；签到用 LunaClient 内置的签到 salt
#   - role-id / server：角色改为 getUserGameRolesByCookie 自动发现（见 GameRoleService）

logging:
  level:
    dev.langchain4j: WARN
