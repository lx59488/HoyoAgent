spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: HoyoAgent

langchain4j:
  open-ai:
    chat-model:
      base-url: ${DS_BASE_URL}
      api-key: ${DS_API_KEY}
      model-name: ${DS_MODEL_NAME}
      log-requests: false
      log-responses: false
      timeout: PT60S

# hosts 不配：默认值写在 MiyousheHost 枚举里，需要覆盖时才加
#   hosts:
#     record: http://127.0.0.1:9999
hoyo:
  timeout: PT10S
  device-id: ${HOYO_DEVICE_ID:}          # 空 = 自动生成；复现已有会话时必须填抓包值
  cookie: ${HOYO_COOKIE:}                # 兜底；扫码写入账号目录后优先用文件
  user-id: ${HOYO_USER_ID:local}         # 单用户阶段固定 local；多用户后由平台适配器注入
  # account-dir: ${HOYO_ACCOUNT_DIR:}    # 默认 ~/.hoyo/accounts（每用户一个 .account 文件）

# 注：UA / app_version / client_type / salt / role-id / server 都已从配置移除
#   - 请求头是成组的（salt 与版本必须配对），统一由 Profiles 管理
#   - 角色 uid 改为 getUserGameRolesByCookie 自动发现（见 GameRoleService）

logging:
  level:
    dev.langchain4j: WARN
