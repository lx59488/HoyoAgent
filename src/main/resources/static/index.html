<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HoyoAgent 调试台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo">H</span>
        <div>
            <h1>HoyoAgent 调试台</h1>
            <p>聊天调试 · 会话记忆</p>
        </div>
    </div>
    <div class="topbar-right">
        <span id="conn" class="pill pill-muted">连接中…</span>
    </div>
</header>

<main class="layout">
    <section class="card">
        <div class="card-head">
            <h2>会话记忆</h2>
            <button id="btn-memory" class="ghost" type="button">刷新</button>
        </div>
        <p class="hint">Agent 会话的记忆窗口，也就是下一轮真正发给模型的内容。</p>
        <p id="memory-session" class="session-id">—</p>
        <p id="memory-meta" class="hint">—</p>
        <ul id="memory-list" class="mem-list"></ul>
    </section>

    <section class="card chat">
        <div class="card-head">
            <h2>对话</h2>
            <div class="segmented" role="tablist" aria-label="对话模式">
                <button class="seg active" data-mode="agent" type="button">Agent（工具）</button>
                <button class="seg" data-mode="chat" type="button">Chat（纯模型）</button>
            </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <div class="suggestions">
            <button type="button" id="btn-clear" class="ghost">清空会话记忆</button>
            <button type="button" id="btn-new-session" class="ghost">新会话</button>
        </div>

        <form id="composer" class="composer">
            <textarea id="input" rows="1" placeholder="问点什么…… Enter 发送，Shift+Enter 换行"></textarea>
            <button id="btn-send" class="primary" type="submit">发送</button>
        </form>
    </section>
</main>

<details class="debug" id="debug">
    <summary>调试面板（最近一次请求 / 响应）</summary>
    <div class="debug-grid">
        <div>
            <h3>请求</h3>
            <pre id="debug-req">—</pre>
        </div>
        <div>
            <h3>响应</h3>
            <pre id="debug-res">—</pre>
        </div>
    </div>
</details>

<script src="/app.js"></script>
</body>
</html>
