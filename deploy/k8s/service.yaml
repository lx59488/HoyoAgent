apiVersion: v1
kind: Service
metadata:
  name: hoyoagent
  namespace: hoyoagent
  labels:
    app.kubernetes.io/name: hoyoagent
spec:
  # 默认只在集群内可达。对外走 Ingress，但先读 ingress.example.yaml 顶部的警告
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hoyoagent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP