# ⚠️ 示例文件，不要原样 kubectl apply。
# 真实 secret 用命令行创建（不进 Git，也就不会跟着仓库泄露）：
#
#   kubectl -n hoyoagent create secret generic hoyoagent-secret \
#     --from-literal=DS_API_KEY='sk-你的key' \
#     --from-literal=HOYO_COOKIE=''
#
# 改 key 之后：
#
#   kubectl -n hoyoagent create secret generic hoyoagent-secret \
#     --from-literal=DS_API_KEY='sk-新key' --from-literal=HOYO_COOKIE='' \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n hoyoagent rollout restart deploy/hoyoagent
#
# 凭据有两条路：HOYO_COOKIE 只够查询；扫码登录（POST /api/auth/qr）把带 stoken 的
# 账号文件写进 /data 卷，优先级更高、重启后仍有效。所以 HOYO_COOKIE 可以留空。
apiVersion: v1
kind: Secret
metadata:
  name: hoyoagent-secret
  namespace: hoyoagent
type: Opaque
stringData:
  DS_API_KEY: sk-CHANGE_ME
  HOYO_COOKIE: ""